# Nginx Server Configuration for SIWES Allocation System
# Location: /etc/nginx/sites-available/siwesp or c:/nginx/conf/nginx.conf

server {
    listen 80;
    server_name siwes.local localhost;
    root /var/www/siwesp/public;

    index index.php index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Character set
    charset utf-8;

    # Client body size for file uploads (documents up to 10MB)
    client_max_body_size 10M;

    # Static file caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|woff|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Restrict direct access to sensitive directories
    location ~ ^/(config|database|src)/ {
        deny all;
        return 404;
    }

    # Main Front Controller Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Processor Engine (PHP 8+)
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000; # or unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        fastcgi_connect_timeout 60s;
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
    }

    # Block access to hidden files (.htaccess, .git, etc.)
    location ~ /\. {
        deny all;
    }

    # Custom Error Pages
    error_page 404 /index.php?route=404;
    error_page 500 502 503 504 /index.php?route=500;
}
