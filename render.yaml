services:
  - type: web
    name: siwes-allocator
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_DRIVER
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: siwes-db
          property: connectionString

databases:
  - name: siwes-db
    plan: free
    region: oregon
    databaseName: siwes_db
    user: postgres
